services:
  backend:
    build: ./server
    ports:
      - "4000:5000"
      - "5005:5005"
    env_file:
      - ./server/.env
      - ./docker.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - START_RAG=true
      - CHROMA_HOST=http://chromadb:8000
      - RAG_SERVICE_URL=http://rag-service:5001
      # JWT_SECRET y REFRESH_TOKEN_SECRET se cargan desde env_file (server/.env y docker.env)
      # NO sobrescribir con variables del shell para evitar vaciar el secret
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - LOCAL_DB_NAME=${LOCAL_DB_NAME}
      - LOCAL_DB_USER=${LOCAL_DB_USER}
      - LOCAL_DB_PASSWORD=${LOCAL_DB_PASSWORD}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - FRONTEND_URL=${FRONTEND_URL}
      - PUBLIC_HOST=${PUBLIC_HOST}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC:-https://*.vercel.app}
      
    volumes:
      - ./server/src:/app/src
      - ./server/uploads:/app/uploads
      - /app/node_modules
      - /app/rag/chroma

    restart: always
    depends_on:
      - database
      - chromadb
      - rag-service
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  database:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${LOCAL_DB_NAME}
      MYSQL_USER: ${LOCAL_DB_USER}
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - db_data:/var/lib/mysql
    # Ocultar puerto de base de datos (solo accesible dentro de la red docker)
    # ports:
    #   - "3306:3306"
    restart: always
    networks:
      - app-network
    command: --default-authentication-plugin=mysql_native_password --ssl=1

  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: chromadb
    restart: always
    # Puerto protegido - solo accesible dentro de red Docker
    # ports:
    #   - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - app-network

  rag-service:
    build: ./server/rag
    container_name: rag-service
    # Puerto protegido - solo accesible dentro de red Docker
    # ports:
    #   - "5001:5001"
    environment:
      - PORT=5001
      - CHROMA_HOST=http://chromadb:8000
      - OLLAMA_HOST=${OLLAMA_HOST:-host.docker.internal}
      - RAG_SERVICE_SECRET=${RAG_SERVICE_SECRET:-change-me-in-production}
    volumes:
      - ./server/rag:/app/rag
      - /app/rag/node_modules
    restart: always
    depends_on:
      - chromadb
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cloudflared:
    image: cloudflare/cloudflared:2024.6.0
    container_name: cloudflared_tunnel
    restart: always
    command: tunnel --url http://backend:5000
    depends_on:
      - backend
    networks:
      - app-network

  backup:
    image: mysql:8.0.36
    container_name: database_backup
    restart: "no"
    volumes:
      - ./scripts/backup-database.sh:/backup-database.sh:ro
      - db_backups:/backups
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    depends_on:
      - database
    networks:
      - app-network
    entrypoint: ["/bin/sh", "-c", "chmod +x /backup-database.sh && /backup-database.sh"]

  frontend:
    build: .
    ports:
      - "3000:80"
    environment:
      - BACKEND_URL=http://backend:5000
      - VITE_BASE_URL=
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC:-https://danhee-cake-sage.vercel.app,https://danhee-cake.vercel.app}
    restart: always
    networks:
      - app-network

# Volumen definido para la persistencia de datos
volumes:
  db_data:
  db_backups:
  chroma_data:

# Red personalizada para comunicación entre servicios
networks:
  app-network:
    driver: bridge