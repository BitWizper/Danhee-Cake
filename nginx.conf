server {
  listen 80;
  server_name _;

  # Security Headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Ocultar versión de nginx completamente
  server_tokens off;
  proxy_hide_header Server;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
    
    # Bloquear acceso a archivos sensibles
    location ~ /\.(?!well-known).* {
      deny all;
      return 404;
    }
    
    # Bloquear rutas comunes de ataque
    location ~ ^/(admin|wp-admin|wp-login|phpmyadmin|cpanel|dashboard|login|\.env|\.git|backup|config|sql)/ {
      deny all;
      return 403;
    }
  }

  location /api/ {
    proxy_pass http://backend:5000/api/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🚀 EVITA QUE NGROK BLOQUEE LAS PETICIONES INTERNAS DE LA API Y EL CHATBOT:
    proxy_set_header ngrok-skip-browser-warning "true";

    # Security headers para API
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_hide_header Server;
  }

  location /uploads/ {
    proxy_pass http://backend:5000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header ngrok-skip-browser-warning "true";

    # Security headers para uploads
    add_header X-Content-Type-Options "nosniff" always;
    proxy_hide_header Server;
  }
}