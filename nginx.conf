# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

server {
  listen 80;
  server_name _;

  # Security Headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://fonts.googleapis.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://unspoken-resurrect-bountiful.ngrok-free.dev http://127.0.0.1:5005; object-src 'none'; frame-ancestors 'none';" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Ocultar completamente header Server
  server_tokens off;
  proxy_hide_header Server;

  root /usr/share/nginx/html;
  index index.html;

  # Bloquear rutas comunes de ataque
  location ~ ^/(admin|wp-admin|wp-login|phpmyadmin|cpanel|dashboard|login|\.env|\.git|backup|config|sql|swagger|docs|temp|logs|debug|test|backoffice|moderator|superuser|root|manage|control|panel) {
    return 404;
  }

  # Bloquear acceso a archivos sensibles
  location ~ /\.(?!well-known).* {
    return 404;
  }

  # Bloquear extensiones de archivos sospechosos
  location ~ \.(zip|tar|gz|rar|bz2|7z|sql|php|phtml|php3|php4|php5|phps|jsp|asp|aspx|cgi|pl|py|rb|sh|bash|zsh|csh|tcsh|ksh|bat|cmd|exe|dll|so|dylib|bin|deb|rpm|dmg|iso|img|vmdk|ova|ovf|qcow2|vdi|map)$ {
    return 404;
  }

  # Proteger assets contra hotlinking y robo de código
  location ~ \.(css|js|json|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|ttf|eot)$ {
    # Permitir acceso desde el propio dominio y orígenes permitidos
    valid_referers none blocked server_names unspoken-resurrect-bountiful.ngrok-free.dev localhost:5173 localhost:3000;
    if ($invalid_referer) {
      return 403;
    }

    # Agregar headers de seguridad para assets
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # Headers adicionales para dificultar robo de código
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
  }

  location / {
    # Rate limiting general
    limit_req zone=general_limit burst=50 nodelay;

    try_files $uri $uri/ /index.html =404;
  }

  location /api/ {
    # Rate limiting para API
    limit_req zone=api_limit burst=20 nodelay;
    
    proxy_pass http://backend:5000/api/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🚀 EVITA QUE NGROK BLOQUEE LAS PETICIONES INTERNAS DE LA API Y EL CHATBOT:
    proxy_set_header ngrok-skip-browser-warning "true";

    # Security headers para API
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://fonts.googleapis.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://unspoken-resurrect-bountiful.ngrok-free.dev http://127.0.0.1:5005; object-src 'none'; frame-ancestors 'none';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_hide_header Server;
  }

  location /uploads/ {
    # Rate limiting para uploads
    limit_req zone=general_limit burst=10 nodelay;
    
    proxy_pass http://backend:5000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header ngrok-skip-browser-warning "true";

    # Security headers para uploads
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://fonts.googleapis.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://unspoken-resurrect-bountiful.ngrok-free.dev http://127.0.0.1:5005; object-src 'none'; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_hide_header Server;
    
    # Manejo de errores del backend
    proxy_intercept_errors on;
    error_page 500 502 503 504 =404 /404.html;
  }
}