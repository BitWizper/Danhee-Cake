version: '3.8'

services:
  frontend:
    build: .
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

  backend:
    build: ./server
    ports:
      - "4000:5000"
      - "5005:5005"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - START_RAG=true
      # Si se quiere forzar la base local en Docker, establecer DB_USE_LOCAL_DB=true.
      - LOCAL_DB_NAME=danhee_db
      - LOCAL_DB_USER=usuario
      - LOCAL_DB_PASSWORD=password
      # Si te conectas a Ollama localmente, usa esta variable:
      - OLLAMA_HOST=host.docker.internal
      # Configuración de base de datos Clever Cloud (desde .env)
      - DB_HOST=bvtdjsmypbwpngczasgf-mysql.services.clever-cloud.com
      - DB_PORT=3306
      - DB_NAME=bvtdjsmypbwpngczasgf
      - DB_USER=ueixm6eypteu4pjt
      - DB_PASSWORD=2BIOKddsIrsSJGKlxClR
    volumes:
      - ./server:/app
      - /app/node_modules
      - /app/rag/chroma
      - server_node_modules:/app/node_modules
    restart: always
    depends_on:
      - database
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${LOCAL_DB_NAME:-danhee_db}
      MYSQL_USER: ${LOCAL_DB_USER:-usuario}
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD:-password}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - db_data:/var/lib/mysql
    # Ocultar puerto de base de datos (solo accesible dentro de la red docker)
    # ports:
    #   - "3306:3306"
    restart: always
    networks:
      - app-network
    command: --default-authentication-plugin=mysql_native_password --ssl=0

  ngrok_tunnel:
    image: ngrok/ngrok:latest
    container_name: ngrok_tunnel
    restart: always
    command:
      - "http"
      - "frontend:80"
      - "--url=https://snitch-wing-riddance.ngrok-free.dev"
    environment:
      NGROK_AUTHTOKEN: "3Gp7G23SVbepk3TmIGTHv9Lb5Fc_2xY2d3HmK9vBE6746ZKhj"
    depends_on:
      - frontend
    networks:
      - app-network

# Volumen definido para la persistencia de datos
volumes:
  db_data:
  server_node_modules:

# Red personalizada para comunicación entre servicios
networks:
  app-network:
    driver: bridge