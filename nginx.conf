server {
  listen 80;
  server_name _;

  # Security Headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://unspoken-resurrect-bountiful.ngrok-free.dev http://127.0.0.1:5005; object-src 'none'; frame-ancestors 'none';" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Server "" always;

  # Ocultar versión de nginx completamente
  server_tokens off;
  proxy_hide_header Server;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
    
    # Bloquear acceso a archivos sensibles
    location ~ /\.(?!well-known).* {
      return 404;
    }
    
    # Bloquear rutas comunes de ataque
    location ~ ^/(admin|wp-admin|wp-login|phpmyadmin|cpanel|dashboard|login|\.env|\.git|backup|config|sql)/ {
      return 404;
    }
    
    # Bloquear extensiones de archivos sospechosos
    location ~ \.(zip|tar|gz|rar|bz2|7z|sql|php|phtml|php3|php4|php5|phps|jsp|asp|aspx|cgi|pl|py|rb|sh|bash|zsh|csh|tcsh|ksh|bat|cmd|exe|dll|so|dylib|bin|deb|rpm|dmg|iso|img|vmdk|ova|ovf|qcow2|vdi|map)$ {
      return 404;
    }
    
    # Proteger assets contra hotlinking y robo de código
    location ~ \.(css|js|json|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|ttf|eot)$ {
      # Permitir acceso desde el propio dominio y orígenes permitidos
      valid_referers none blocked server_names https://unspoken-resurrect-bountiful.ngrok-free.dev http://localhost:5173 http://localhost:3000;
      if ($invalid_referer) {
        return 403;
      }
      
      # Agregar headers de seguridad para assets
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      
      # Headers adicionales para dificultar robo de código
      add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    }
  }

  location /api/ {
    proxy_pass http://backend:5000/api/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🚀 EVITA QUE NGROK BLOQUEE LAS PETICIONES INTERNAS DE LA API Y EL CHATBOT:
    proxy_set_header ngrok-skip-browser-warning "true";

    # Security headers para API
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://unspoken-resurrect-bountiful.ngrok-free.dev http://127.0.0.1:5005; object-src 'none'; frame-ancestors 'none';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_hide_header Server;
  }

  location /uploads/ {
    proxy_pass http://backend:5000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header ngrok-skip-browser-warning "true";

    # Security headers para uploads
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://unspoken-resurrect-bountiful.ngrok-free.dev http://127.0.0.1:5005; object-src 'none'; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_hide_header Server;
    
    # Manejo de errores del backend
    proxy_intercept_errors on;
    error_page 500 502 503 504 =404 /404.html;
  }
}